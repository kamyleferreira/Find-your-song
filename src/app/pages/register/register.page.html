<ion-content class="register-content" fullscreen>
  <div class="register-wrapper">
    <div class="register-card">
      <div class="card-accent"></div>
      <h1>Criar nova conta</h1>

      <form (submit)="onSubmit()">
        <div class="input-group">
          <label for="register-nickname">Nickname</label>
          <div class="input-wrapper">
            <ion-icon name="person-outline" aria-hidden="true"></ion-icon>
            <ion-input
              id="register-nickname"
              type="text"
              [(ngModel)]="form.nickname"
              name="nickname"
              placeholder="Seu nickname único"
              autocomplete="nickname"
            ></ion-input>
          </div>
        </div>

        <div class="input-group">
          <label for="register-fullname">Nome Completo</label>
          <div class="input-wrapper">
            <ion-icon name="person-circle-outline" aria-hidden="true"></ion-icon>
            <ion-input
              id="register-fullname"
              type="text"
              [(ngModel)]="form.fullName"
              name="fullName"
              placeholder="Seu nome completo"
              autocomplete="name"
            ></ion-input>
          </div>
        </div>

        <div class="input-group">
          <label for="register-email">Email</label>
          <div class="input-wrapper">
            <ion-icon name="mail-outline" aria-hidden="true"></ion-icon>
            <ion-input
              id="register-email"
              type="email"
              [(ngModel)]="form.email"
              name="email"
              placeholder="seu.email@exemplo.com"
              autocomplete="email"
            ></ion-input>
          </div>
        </div>

        <div class="input-group">
          <label for="register-password">Senha</label>
          <div class="input-wrapper with-trailing">
            <ion-icon name="lock-closed-outline" aria-hidden="true"></ion-icon>
            <ion-input
              id="register-password"
              type="password"
              [(ngModel)]="form.password"
              name="password"
              placeholder="Sua senha segura"
              autocomplete="new-password"
            ></ion-input>
            <ion-icon class="trailing" name="eye-outline" aria-hidden="true"></ion-icon>
          </div>
        </div>

        <div class="input-group">
          <label for="register-confirm">Confirmar Senha</label>
          <div class="input-wrapper with-trailing">
            <ion-icon name="lock-closed-outline" aria-hidden="true"></ion-icon>
            <ion-input
              id="register-confirm"
              type="password"
              [(ngModel)]="form.confirm"
              name="confirm"
              placeholder="Confirme sua senha"
              autocomplete="new-password"
            ></ion-input>
            <ion-icon class="trailing" name="eye-outline" aria-hidden="true"></ion-icon>
          </div>
        </div>

        <ion-button (click) = "onSubmit()"class="register-btn" expand="block" type="submit" >
          Criar Conta
        </ion-button>

        <ion-button class="back-btn" expand="block" fill="clear" [routerLink]="['/login']" [disabled]="isSubmitting">
          <ion-icon name="arrow-back-outline" slot="start" aria-hidden="true"></ion-icon>
          Voltar
        </ion-button>
      </form>

      <p class="login-link">
        Já tem uma conta?
        <a [routerLink]="['/login']">Fazer login</a>
      </p>
    </div>
  </div>
</ion-content>
